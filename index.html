<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EF">
<title>SoleMate – Phone Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EF;--ink:#121214;--mute:#6E6E73;--soft:#ECE9E4;--teal:#12666B;--tealSoft:#E3EFEE;--red:#DB4538;--orange:#F08F29;--green:#389E5C;--blue:#3B78D9;--sh:0 8px 24px rgba(0,0,0,.07)}
/* hide anything injected outside the app (e.g. the 'Powered by Netlify' badge) so it can't cover the menu */
body>*:not(#app):not(script){display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.content{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;justify-content:space-around;padding:10px 6px calc(env(safe-area-inset-bottom) + 12px);background:#fff;box-shadow:0 -6px 18px rgba(0,0,0,.05)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#9b968e;padding:4px 10px}
.nav svg{width:22px;height:22px}
.nav button.sel{color:var(--teal)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hT{font-size:26px;font-weight:800;letter-spacing:-.035em}
.hS{font-size:13px;color:var(--mute);margin-top:2px}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px}
.ctitle{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.small{font-size:12.5px;color:var(--mute);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.dark{background:var(--ink);color:#fff;box-shadow:none}
.pill.soft{background:var(--soft);box-shadow:none}
.d{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;justify-content:space-between}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em}
.stat span{font-size:12px;color:var(--mute)}
.btn{padding:14px 18px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;text-align:center}
.btn.dark{background:var(--ink);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;gap:2px}

.banner{border-radius:22px;padding:16px;color:#fff;display:flex;gap:12px;align-items:center;animation:pop .35s ease}

.toggle::after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--ink)}.toggle.on::after{left:22px}
.lrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.lrow .tx{flex:1;min-width:0}.lrow .tx b{display:block;font-size:14.5px}.lrow .tx span{font-size:12.5px;color:var(--mute)}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.big{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1}
.ai{background:var(--tealSoft);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px}
.mini b{display:block;font-size:17px;letter-spacing:-.02em}.mini span{font-size:11.5px;color:var(--mute)}
.risk{background:#FFF4E8;border-radius:20px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}

.ring{width:190px;height:190px;position:relative}

.nav .sosb{width:58px;height:58px;margin-top:-26px;padding:0;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:15px;letter-spacing:.04em;box-shadow:0 8px 20px rgba(219,69,56,.45),0 0 0 5px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}

.nav button{padding:4px 4px}

.check b{font-size:16px;display:block}.check p{font-size:12.5px;opacity:.8;margin:3px 0 12px}
.check .row button{flex:1;padding:11px 8px;border-radius:99px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700;color:#fff}

.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:99px}
.brow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-top:8px}.brow span{width:92px;color:var(--mute)}.brow b{width:28px;text-align:right;font-size:12.5px}
.ladder{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}

.ladder div.on{background:#fff;color:var(--red)}.ladder div.done{opacity:.6}
.ladder .k{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}

@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mapbtns{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:18px;font-weight:700}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px}.leg div{display:flex;gap:8px;align-items:flex-start}.leg b{display:block;font-size:13px}.leg span{color:var(--mute);font-size:11.5px}

.mount .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="content" id="content"></div>
  <nav class="nav" id="nav"></nav>
  <div class="toast" id="toast"></div>
  <div id="check"></div>
  <div class="sheet" id="sheet"></div>
  <div id="overlay"></div>
</div>
<script>
/* ================= constants ================= */
let STEP_LEN=0.7;          // metres per step (adjustable in Demo)
const ALERT_M=8;           // warn this many metres before a hazard
// ---- Slip threshold from research ----
// Iraqi, Cham, Redfern, Vidic & Beschorner (2018), J. Biomechanics 74:57-63 — 39 unexpected slips:
// sliding speed 0.10 m/s at slip start (20 ms after heel strike) -> 1.87 m/s at peak sliding speed (150 ms).
// Average foot acceleration during the slip = (1.87-0.10)/(0.150-0.020) = 13.6 m/s².
// Allowing ±10% error: slip band 12.3 – 15.0 m/s². We trigger at the LOWER bound (12.3 m/s²);
// anything above the band is an even harder slip and also counts.
const SLIP_AVG=13.6, SLIP_LOW=+(SLIP_AVG*0.9).toFixed(1), SLIP_HIGH=+(SLIP_AVG*1.1).toFixed(1);
const SLIP_WIN=130;        // ms — the slip window measured in the study (20 ms -> 150 ms)
let SLIP_TH=SLIP_LOW;      // m/s² (Demo → sensitivity can lower it for classroom tests)
const C={teal:'#12666B',red:'#DB4538',orange:'#F08F29',green:'#389E5C',blue:'#3B78D9',ink:'#121214'};
const P={run:'<path d="M13 4a2 2 0 1 0 4 0 2 2 0 0 0-4 0"/><path d="M7 21l3-6 3 2v5M10 15l1-6 4 3 3 1M8 9l3-1"/>',map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',report:'<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',buddy:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.8-1.6-4.8-4-5.6"/>',ar:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/>',alert:'<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>',head:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
Object.assign(P,{phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',pause:'<path d="M9 5v14M15 5v14"/>',pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',coach:'<path d="M12 3v3M5 6l2 2M19 6l-2 2"/><path d="M8 14a4 4 0 1 1 8 0c0 2-2 3-2 5h-4c0-2-2-3-2-5z"/><path d="M10 21h4"/>'});
// people in the app
const PEOPLE={Emma:{c:'#12666B',rel:'Partner',d:30,b:35},Mom:{c:'#8B5CF6',rel:'Family',d:45,b:200},Jake:{c:'#3B78D9',rel:'Friend',d:55,b:-60},Linh:{c:'#F08F29',rel:'Friend',d:80,b:120},Sam:{c:'#389E5C',rel:'Friend',d:65,b:-150}};
const EMERGENCY=['Emma','Mom'];
const WEEK=[['Mon',6200,71],['Tue',8400,73],['Wed',4100,70],['Thu',9300,75],['Fri',7700,76],['Sat',12600,74]];
const MONTH=[['Wk 1',41200,69],['Wk 2',47800,71],['Wk 3',52100,73]];
const I=(k,s=22,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const SOLE='M100 12C150 12 176 62 173 122C170 172 150 202 150 252C150 302 166 342 161 392C156 442 131 458 100 458C69 458 47 442 44 397C41 352 54 302 51 252C49 202 29 162 29 112C29 52 54 12 100 12Z';

/* ================= state ================= */
function fresh(){return{foot:'right',mount:'sock',started:false,steps:0,strides:[],strikes:{heel:0,mid:0,fore:0},impacts:[],pron:[],stancePitch:[],
 lastStrike:'—',lastImpact:0,stanceRoll:[],paused:false,uneven:0,lastUneven:0,slope:'flat',slopeForced:null,slips:0,offset:0,sharing:true,alertMode:'earbuds',buddy:true,
 buddies:{Emma:true,Mom:true,Jake:false},alertsSent:[],banner:null,pulseId:null,
 hazards:[{id:1,pos:14,type:'ice',label:'Black ice',reports:8,lap:-1},{id:2,pos:34,type:'slope',label:'Steep slope',reports:5,lap:-1}],nextId:3,
 goal:8000,terrainLog:[],distM:0,stanceStartT:0,onBreak:false,trek:null,addOpen:false,arTarget:null,mapZoom:1,mapPan:[0,0],mapSel:null,safeRoute:false,period:'day',check:null,lastStepT:0,coachOn:true,heelRun:0,myTrail:true,startT:Date.now()}}
let S=fresh(), tab='run', emer=null, bannerTimer=null, toastTimer=null, sensorsSeen=false, heading=null, arBear={}, dragMoved=false, camStream=null, wakeLock=null;
const TRAIL_M=60;

/* ================= sensing ================= */
const grav={x:0,y:0,z:9.81};let calib=null,calibBuf=null,calibPhase=null;
// ---- vector helpers: we measure tilt against the calibrated "standing" direction, so it works in any phone position ----
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
// g0 = gravity while standing still. g1 = gravity while leaning "forward" (sock: knee forward, shoe: toes up).
// f = the forward-tilt direction learned from that lean; s = the side-tilt direction.
function buildCalib(g0,g1){let f=null,learned=false;
 if(g1){const d=dot(g1,g0);const p=[g1[0]-d*g0[0],g1[1]-d*g0[1],g1[2]-d*g0[2]];if(Math.hypot(...p)>Math.sin(8/57.3)){f=norm(p);learned=true;}}
 if(!f){const ax=S.mount==='sock'?[0,0,1]:[0,1,0];const d=dot(ax,g0);f=norm([ax[0]-d*g0[0],ax[1]-d*g0[1],ax[2]-d*g0[2]]);}
 return{g0,f,s:norm(cross(g0,f)),learned};}
const live={pitch:0,roll:0,gyro:0,g:1,lin:0,ground:0,unev:0,slideMax:0,dz:0,dd:0};
const D2R=Math.PI/180;
let buf=[],lastSlip=0,fallCand=0,tiltStill=0,stanceSamples=[],handT=0,flatT=0;
const median=a=>{const b=[...a].sort((x,y)=>x-y);const m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2;};
/* ================= NAV engine: AHRS + ZUPT (same maths as terrain_pipeline.py) =================
   1. Mahony AHRS tracks the phone's 3D attitude, so gravity is removed in the Earth frame at any tilt.
   2. Quasi-still moments (foot planted) = zero velocity (ZUPT). Each swing between two of them is
      integrated with linear drift removal -> true height change dz and distance dd of that stride.
      Comparing planted moment to planted moment cancels the up-and-down arc of the swing.
   3. Terrain = grade over the last 3 strides; stairs = 2 strides in a row with a big, steep rise.
   4. Slip = Earth-horizontal acceleration averaged over 130 ms >= research threshold, right after landing,
      while the foot is not swinging (low rotation).                                                     */
const qmul=(a,b)=>[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qnorm=q=>{const l=Math.hypot(q[0],q[1],q[2],q[3])||1;return[q[0]/l,q[1]/l,q[2]/l,q[3]/l];};
function qrot(q,v){const[w,x,y,z]=q;return[(1-2*(y*y+z*z))*v[0]+2*(x*y-w*z)*v[1]+2*(x*z+w*y)*v[2],2*(x*y+w*z)*v[0]+(1-2*(x*x+z*z))*v[1]+2*(y*z-w*x)*v[2],2*(x*z-w*y)*v[0]+2*(y*z+w*x)*v[1]+(1-2*(x*x+y*y))*v[2]];}
const upInBody=q=>{const[w,x,y,z]=q;return[2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)];};
function qFromUp(f){const u=norm(f),s=Math.hypot(u[1],u[0]);if(s<1e-9)return u[2]>0?[1,0,0,0]:[0,1,0,0];const h=Math.atan2(s,u[2])/2,k=Math.sin(h)/s;return[Math.cos(h),u[1]*k,-u[0]*k,0];}
const TERR={flat:'Flat ground',up:'Uphill','steep-up':'Steep uphill',down:'Downhill','steep-down':'Steep downhill','stairs-up':'Stairs up','stairs-down':'Stairs down'};
const TERR_SAY={up:'Uphill.','steep-up':'Steep uphill. Short steps, lean forward.',down:'Downhill. Shorter steps.','steep-down':'Steep downhill. Slow down and take short steps.','stairs-up':'Stairs going up.','stairs-down':'Stairs going down. Hold the rail.',flat:'Flat ground again.'};
const NAV={v:[0,0,0],vpk:0,dir:[1,0],landed:false,vmin:0,ready:false,q:[1,0,0,0],bias:[0,0,0],g:9.81,ei:[0,0,0],quietMs:0,still:true,buf:[],peakW:0,strides:[],sw:[],lastImpact:-1e9,landT:-1e9,pend:null,pendN:0,grade:0,last:null};
function navInit(f0,gb){lastSlip=-1e9;Object.assign(NAV,{warm:2,v:[0,0,0],landed:false,ready:true,q:qFromUp(f0),bias:gb,g:Math.hypot(f0[0],f0[1],f0[2])||9.81,ei:[0,0,0],quietMs:0,still:true,buf:[],peakW:0,strides:[],sw:[],pend:null,pendN:0,grade:0,last:null});}
const NAVTH=()=>S.mount==='sock'?{w:1.6,a:1.5}:{w:0.6,a:1.0};   // quasi-still limits: rad/s, m/s²
function navStep(f,w0,dt,t){
 const w=[w0[0]-NAV.bias[0],w0[1]-NAV.bias[1],w0[2]-NAV.bias[2]];
 const wm=Math.hypot(w[0],w[1],w[2]),fm=Math.hypot(f[0],f[1],f[2]),th=NAVTH();
 const quiet=wm<th.w&&Math.abs(fm-NAV.g)<th.a;NAV.quietMs=quiet?NAV.quietMs+dt*1000:0;
 const planted=NAV.quietMs>=60;                     // conservative: the WHOLE last 60 ms was still
 // ---- AHRS: gyro drives, accelerometer corrects only while planted ----
 let wc=w;if(planted){const e=cross(norm(f),upInBody(NAV.q));for(let i=0;i<3;i++)NAV.ei[i]+=e[i]*dt;wc=[0,1,2].map(i=>w[i]+2*e[i]+0.02*NAV.ei[i]);}

function seg(m0,m1,col){let d='';for(let k=0;k<=24;k++){const p=at(m0+(m1-m0)*k/24);d+=(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}return`<path d="${d}" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/>`;}
const PTS=[[34,350],[62,298],[108,262],[146,226],[166,176],[214,146],[246,96],[282,36]];
const SEGL=(()=>{const L=[0];for(let i=1;i<PTS.length;i++)L.push(L[i-1]+Math.hypot(PTS[i][0]-PTS[i-1][0],PTS[i][1]-PTS[i-1][1]));return L})();
function at(m){const f=Math.max(0,Math.min(1,m/TRAIL_M))*SEGL[SEGL.length-1];for(let i=1;i<PTS.length;i++)if(f<=SEGL[i]){const t=(f-SEGL[i-1])/(SEGL[i]-SEGL[i-1]);return[PTS[i-1][0]+(PTS[i][0]-PTS[i-1][0])*t,PTS[i-1][1]+(PTS[i][1]-PTS[i-1][1])*t];}return PTS[PTS.length-1];}

/* ================= start / sensors ================= */
async function start(){S.started=true;S.startT=Date.now();try{actx=actx||new AudioContext();await actx.resume();}catch(e){}
 try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();}catch(e){}
 window.addEventListener('devicemotion',onMotion);
 const ori=e=>{if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute'))heading=(360-e.alpha)%360;};
 window.addEventListener('deviceorientationabsolute',ori);window.addEventListener('deviceorientation',ori);
 try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
 calibrate();}
const setCalN=n=>{const e=document.getElementById('calN');if(e&&n>0)e.firstChild.nodeValue=n;};
function calibrate(){calibBuf={x:0,y:0,z:0,n:0,gx:0,gy:0,gz:0,skip:false};calibPhase='still';speak('Calibrating. Stand still.',100);let n=3;renderOverlay();
 const iv=setInterval(()=>{n--;setCalN(n);if(n>0)return;clearInterval(iv);
  const ok0=calibBuf.n>5, g0=ok0?norm([calibBuf.x,calibBuf.y,calibBuf.z]):[0,0,1];
  const f0=ok0?[calibBuf.x/calibBuf.n,calibBuf.y/calibBuf.n,calibBuf.z/calibBuf.n]:[0,0,9.81], gb=ok0?[calibBuf.gx/calibBuf.n,calibBuf.gy/calibBuf.n,calibBuf.gz/calibBuf.n]:[0,0,0];
  calibBuf={x:0,y:0,z:0,n:0,gx:0,gy:0,gz:0,skip:true};calibPhase='lean';renderOverlay();
  speak(S.mount==='sock'?'Now bend your knee forward and hold.':'Now lift your toes and hold.',100);
  let m=3;const iv2=setInterval(()=>{m--;setCalN(m);if(m===2)calibBuf.skip=false;if(m>0)return;clearInterval(iv2);
   const g1=calibBuf.n>5?norm([calibBuf.x,calibBuf.y,calibBuf.z]):null;
   calib=buildCalib(g0,g1);calibBuf=null;calibPhase=null;navInit(f0,gb);S.stancePitch=[];S.stanceRoll=[];
   renderOverlay();render();
   if(!sensorsSeen)toast('No motion sensors found. Use the Demo button.');
   else{speak(calib.learned?'SoleMate is ready. Start walking.':'I could not feel the lean, so I used default directions. You can recalibrate in Demo.',100);if(!calib.learned)toast('Lean not detected · using default directions (Demo → Recalibrate)');}},1000);},1000);}
async function startCam(){if(camStream)return attachCam();try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});attachCam();}catch(e){}}
function attachCam(){const v=document.getElementById('cam');if(v&&camStream&&v.srcObject!==camStream)v.srcObject=camStream;}

 else if(a==='trek-join'){S.trek={code:'SOLE-4821',members:['Emma','Jake']};S.addOpen=false;toast('Joined Emma’s trek with code SOLE-4821');}
 else if(a==='trek-end'){S.trek=null;S.addOpen=false;S.arTarget=null;toast('Group trek ended');}
 else if(a==='add-open')S.addOpen=true;else if(a==='add-close')S.addOpen=false;
 else if(a.startsWith('add-')){const k=a.slice(4);if(S.trek&&!S.trek.members.includes(k)){S.trek.members.push(k);toast(`${k} added · they can see your footprints`);}}
 else if(a.startsWith('rm-')){const k=a.slice(3);if(S.trek){S.trek.members=S.trek.members.filter(x=>x!==k);if(S.arTarget===k)S.arTarget=null;toast(`${k} removed from the trek`);}}
 else if(a.startsWith('find-')){S.arTarget=a.slice(5);tab='ar';}
 // AR
 else if(a==='arx-pin'){S.arPins=S.arPins||[];S.arPins.push([110+Math.random()*130,360+Math.random()*120]);toast('Pin dropped · your group sees it in AR');}
 else if(a==='arx-ping'){toast(`Ping sent to ${S.arTarget}`);speak(`Ping sent to ${S.arTarget}.`,100);return;}
 else if(a==='mytrail')S.myTrail=!S.myTrail;
 else if(a.startsWith('ar-'))S.arTarget=a.slice(3);
 // demo
 else if(a==='d-step'){addStride('mid',1.6);}
 else if(a==='d-heel'){addStride('heel',3.3);}
 else if(a==='d-slip'){demoSheet(false);slip('demo');return;}
 else if(a==='d-rest'){demoSheet(false);openCheck({kind:'rest'});speak('Are you resting?');return;}
 else if(a==='d-hazard'){demoSheet(false);skipToHazard();return;}
 else if(a==='d-up'||a==='d-down'){S.slopeForced=a==='d-up'?'up':'down';setSlopeState(S.slopeForced);demoSheet(true);}
 else if(a==='d-flat'){S.slopeForced=null;setSlopeState('flat');demoSheet(true);}
 else if(a.startsWith('slip-')){SLIP_TH=parseFloat(a.slice(5));demoSheet(true);}
 else if(a.startsWith('len-')){STEP_LEN=parseFloat(a.slice(4));demoSheet(true);}
 else if(a==='d-recal'){demoSheet(false);calibrate();return;}
 else if(a==='d-reset'){const f=S.foot,mt=S.mount;S=fresh();S.foot=f;S.mount=mt;S.started=true;NAV.strides=[];NAV.pend=null;NAV.grade=0;demoSheet(false);closeCheck();}
 render();});
render();
</script>
