<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EF">
<title>SoleMate – Phone Prototype</title>

<style>
:root{--bg:#F5F3EF;--ink:#121214;--mute:#57575C;--soft:#ECE9E4;--teal:#12666B;--tealSoft:#E3EFEE;--red:#B3261E;--orange:#A84E0A;--green:#2A7A47;--blue:#2A5DB8;--sh:0 8px 24px rgba(0,0,0,.07)}
/* hide anything injected outside the app (e.g. the 'Powered by Netlify' badge) so it can't cover the menu */
body>*:not(#app):not(script){display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.content{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;justify-content:space-around;padding:10px 6px calc(env(safe-area-inset-bottom) + 12px);background:#fff;box-shadow:0 -6px 18px rgba(0,0,0,.05)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#68635B;padding:4px 10px}
.nav svg{width:22px;height:22px}
.nav button.sel{color:var(--teal)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hT{font-size:26px;font-weight:800;letter-spacing:-.035em}
.hS{font-size:13px;color:var(--mute);margin-top:2px}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px}
.ctitle{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.small{font-size:12.5px;color:var(--mute);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.dark{background:var(--ink);color:#fff;box-shadow:none}
.pill.soft{background:var(--soft);box-shadow:none}
.d{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;justify-content:space-between}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em}
.stat span{font-size:12px;color:var(--mute)}
.btn{padding:14px 18px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;text-align:center}
.btn.dark{background:var(--ink);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;padding:10px 6px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.sel{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.banner{border-radius:22px;padding:16px;color:#fff;display:flex;gap:12px;align-items:center;animation:pop .35s ease}
.banner b{display:block;font-size:17px;letter-spacing:-.01em}
.banner span{font-size:12.5px;opacity:.92}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.toggle{width:48px;height:29px;border-radius:99px;background:#8A847B;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--ink)}.toggle.on::after{left:22px}
.lrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.lrow .tx{flex:1;min-width:0}.lrow .tx b{display:block;font-size:14.5px}.lrow .tx span{font-size:12.5px;color:var(--mute)}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.big{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1}
.ai{background:var(--tealSoft);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px}
.mini b{display:block;font-size:17px;letter-spacing:-.02em}.mini span{font-size:11.5px;color:var(--mute)}
.risk{background:#FFF4E8;border-radius:20px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.toast{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);background:var(--ink);color:#fff;border-radius:18px;padding:13px 15px;font-size:13px;font-weight:500;z-index:40;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.over{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:16px}
.over .h3{font-size:28px;letter-spacing:-.035em}
.ring{width:190px;height:190px;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;font-weight:800;letter-spacing:-.04em}
.ring .n small{font-size:13px;font-weight:500;letter-spacing:0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);z-index:35;box-shadow:0 -10px 30px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .3s}
.sheet.open{transform:none}
.sheet .grid2 .btn{padding:13px 10px;font-size:13px}
.debug{font:12px ui-monospace,Menlo,monospace;color:var(--mute);display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.arwrap{position:absolute;inset:0;background:#3b4245;overflow:hidden}
.arwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fp{animation:fp 2.4s infinite}
@keyframes fp{0%{opacity:0}20%{opacity:1}80%{opacity:.9}100%{opacity:0}}
.pulse{animation:pulse 1.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.mount{display:flex;gap:12px;align-items:flex-start;text-align:left}
.nav .sosb{width:58px;height:58px;margin-top:-26px;padding:0;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:15px;letter-spacing:.04em;box-shadow:0 8px 20px rgba(219,69,56,.45),0 0 0 5px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}
.nav .sosb small{font-size:9px;font-weight:600;letter-spacing:0;opacity:.9}
.nav button{padding:4px 4px}
.check{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:28;background:var(--ink);color:#fff;border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .3s ease}
.check b{font-size:16px;display:block}.check p{font-size:12.5px;opacity:.8;margin:3px 0 12px}
.check .row button{flex:1;padding:11px 8px;border-radius:99px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700;color:#fff}
.check .row button.w{background:#fff;color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:99px}

.ladder div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22);font-size:13.5px;font-weight:600}
.ladder div.on{background:#fff;color:var(--red)}.ladder div.done{opacity:.6}
.ladder .k{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.beat{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mapbtns{position:absolute;right:14px;top:14px;display:grid;grid-template-columns:32px 32px;gap:5px}
.mapbtns button{width:32px;height:32px;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:18px;font-weight:700}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px}.leg div{display:flex;gap:8px;align-items:flex-start}.leg b{display:block;font-size:13px}.leg span{color:var(--mute);font-size:11.5px}
#xrUI button{pointer-events:auto}
.btn.sm{padding:8px 12px;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.mount .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
/* ---- WCAG 2.2 AA ---- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid #12666B;outline-offset:2px;border-radius:12px}
.over :focus-visible,.check :focus-visible,.banner :focus-visible{outline-color:#fff}
.content{scroll-padding-bottom:140px;scroll-padding-top:20px}
h1,h2,h3{font:inherit}
input{border:1.5px solid #8A847B!important}
input:focus-visible{border-color:#12666B!important}
.seg button.sel{font-weight:700}
.seg button,.nav button,.pill,.btn{min-height:24px;min-width:24px}
.ladder div.done{opacity:1}
.ladder div.done .k{background:#fff;color:#B3261E}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.sos-big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--red);color:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 24px rgba(179,38,30,.3)}
.sos-big .sos-c{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--red);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.sos-big b{display:block;font-size:19px}.sos-big span span{font-size:13px}
.pm{width:36px;height:36px;border-radius:50%;background:#FBE9E7;color:var(--red);font-size:22px;font-weight:700;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.pm.add{background:#E3EFEE;color:var(--teal)}
.backb{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:20px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center;margin-right:10px}
.hdr{align-items:center}
</style>
</head>
<body>

<script>
/* ================= constants ================= */
let STEP_LEN=0.7;          // metres per step (adjustable in Demo)

// ---- Slip threshold from research ----
// Iraqi, Cham, Redfern, Vidic & Beschorner (2018), J. Biomechanics 74:57-63 — 39 unexpected slips:
// sliding speed 0.10 m/s at slip start (20 ms after heel strike) -> 1.87 m/s at peak sliding speed (150 ms).
// Average foot acceleration during the slip = (1.87-0.10)/(0.150-0.020) = 13.6 m/s².
// Allowing ±10% error: slip band 12.3 – 15.0 m/s². We trigger at the LOWER bound (12.3 m/s²);
// anything above the band is an even harder slip and also counts.
const SLIP_AVG=13.6, SLIP_LOW=+(SLIP_AVG*0.9).toFixed(1), SLIP_HIGH=+(SLIP_AVG*1.1).toFixed(1);
const SLIP_WIN=130;        // ms — the slip window measured in the study (20 ms -> 150 ms)
let SLIP_TH=SLIP_LOW;      // m/s² (Demo → sensitivity can lower it for classroom tests)
const C={teal:'#12666B',red:'#B3261E',orange:'#A84E0A',green:'#2A7A47',blue:'#2A5DB8',ink:'#121214'};
const P={run:'<path d="M13 4a2 2 0 1 0 4 0 2 2 0 0 0-4 0"/><path d="M7 21l3-6 3 2v5M10 15l1-6 4 3 3 1M8 9l3-1"/>',map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',report:'<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',buddy:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.8-1.6-4.8-4-5.6"/>',ar:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/>',alert:'<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>',head:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
Object.assign(P,{msg:'<path d="M4 5h16v11H9l-5 4z"/>',up:'<path d="M4 18L20 6M20 6h-7M20 6v7"/>',down:'<path d="M4 6l16 12M20 18h-7M20 18v-7"/>',flat:'<path d="M3 12h17M14 6l6 6-6 6"/>',ice:'<path d="M12 2v20M3.5 7l17 10M20.5 7l-17 10"/><path d="M9 4l3 2 3-2M9 20l3-2 3 2"/>',rock:'<path d="M3 19l4-8 4 3 3-6 7 11z"/>',check:'<path d="M5 12l5 5 9-10"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',pause:'<path d="M9 5v14M15 5v14"/>',pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',coach:'<path d="M12 3v3M5 6l2 2M19 6l-2 2"/><path d="M8 14a4 4 0 1 1 8 0c0 2-2 3-2 5h-4c0-2-2-3-2-5z"/><path d="M10 21h4"/>'});
// people in the app
const PEOPLE={Emma:{c:'#12666B',rel:'Partner',d:30,b:35},Mom:{c:'#6B3FD1',rel:'Family',d:45,b:200},Jake:{c:'#2A5DB8',rel:'Friend',d:55,b:-60},Linh:{c:'#A84E0A',rel:'Friend',d:80,b:120},Sam:{c:'#2A7A47',rel:'Friend',d:65,b:-150}};
Object.defineProperty(window,'EMERGENCY',{get:()=>(typeof S!=='undefined'&&S.family&&S.family.length)?S.family:['your emergency contact']});   // = Family list, editable
const WEEK=[['Mon',6200,71],['Tue',8400,73],['Wed',4100,70],['Thu',9300,75],['Fri',7700,76],['Sat',12600,74]];
const MONTH=[['Wk 1',41200,69],['Wk 2',47800,71],['Wk 3',52100,73]];
const I=(k,s=22,c='currentColor')=>`<svg aria-hidden="true" focusable="false" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const SOLE='M100 12C150 12 176 62 173 122C170 172 150 202 150 252C150 302 166 342 161 392C156 442 131 458 100 458C69 458 47 442 44 397C41 352 54 302 51 252C49 202 29 162 29 112C29 52 54 12 100 12Z';

/* ================= state ================= */
function fresh(){return{family:['Emma','Mom'],famOpen:false,tabHist:[],pickDest:false,trek:null,showQR:false,ob:0,dest:null,voice:true,msgs:[],mapPerson:null,breakUntil:0,eta:0,fix:null,batLevel:null,foot:'right',mount:'sock',started:false,steps:0,strides:[],strikes:{heel:0,mid:0,fore:0},impacts:[],pron:[],stancePitch:[],
 lastStrike:'—',lastImpact:0,stanceRoll:[],paused:false,uneven:0,lastUneven:0,slope:'flat',slopeForced:null,slips:0,offset:0,sharing:true,alertMode:'earbuds',buddy:true,
 buddies:{Emma:true,Mom:true,Jake:false},alertsSent:[],banner:null,pulseId:null,
 hazards:[{id:1,pos:14,type:'ice',label:'Black ice',reports:8,lap:-1},{id:2,pos:34,type:'slope',label:'Steep slope',reports:5,lap:-1}],nextId:3,
 goal:8000,terrainLog:[],distM:0,stanceStartT:0,onBreak:false,addOpen:false,arTarget:null,mapZoom:1,mapPan:[0,0],mapSel:null,safeRoute:false,period:'day',check:null,lastStepT:0,coachOn:true,heelRun:0,myTrail:true,startT:Date.now()}}
let devBeta=null,xrState=null,xrOK=null,arWalk=0,arStep={hi:false,t:0},arSeen={};
let S=fresh(), tab='run', emer=null, bannerTimer=null, toastTimer=null, sensorsSeen=false, heading=null, arBear={}, dragMoved=false, camStream=null, wakeLock=null;
const TRAIL_M=60;
// prototype route data: what other SoleMate users reported on the way (looping 60 m demo trail)
const DEST={'River Valley Trail':[['up','Uphill',12,6],['ice','Ice',24,8],['down','Downhill',38,5],['uneven','Rocky ground',50,3]],
 'MacEwan Campus':[['ice','Ice',15,3],['up','Stairs up',32,9],['down','Ramp down',47,4]],
 'Hawrelak Park':[['down','Downhill',10,4],['ice','Ice',28,5],['up','Uphill',44,6]]};
function setDest(name){S.dest=name;const r=DEST[name]||DEST['River Valley Trail'];S.hazards=r.map(([type,label,pos,reports],i)=>({id:i+1,type,label,pos,reports,lap:-1}));S.nextId=r.length+1;}
const GLYPH={up:'↑',down:'↓',ice:'❄',uneven:'▲',slope:'↑'};
DEST['Nearby trails']=DEST['River Valley Trail'];
const ICON={up:'up',down:'down',ice:'ice',uneven:'rock',slope:'up'};

/* ================= sensing ================= */
const grav={x:0,y:0,z:9.81};let calib=null,calibBuf=null,calibPhase=null;
// ---- vector helpers: we measure tilt against the calibrated "standing" direction, so it works in any phone position ----
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
// g0 = gravity while standing still. g1 = gravity while leaning "forward" (sock: knee forward, shoe: toes up).
// f = the forward-tilt direction learned from that lean; s = the side-tilt direction.
function buildCalib(g0,g1){let f=null,learned=false;
 if(g1){const d=dot(g1,g0);const p=[g1[0]-d*g0[0],g1[1]-d*g0[1],g1[2]-d*g0[2]];if(Math.hypot(...p)>Math.sin(8/57.3)){f=norm(p);learned=true;}}
 if(!f){const ax=S.mount==='sock'?[0,0,1]:[0,1,0];const d=dot(ax,g0);f=norm([ax[0]-d*g0[0],ax[1]-d*g0[1],ax[2]-d*g0[2]]);}
 return{g0,f,s:norm(cross(g0,f)),learned};}
const live={pitch:0,roll:0,gyro:0,g:1,lin:0,ground:0,unev:0,slideMax:0,dz:0,dd:0};
const D2R=Math.PI/180;

/* ================= NAV engine: AHRS + ZUPT (same maths as terrain_pipeline.py) =================

   2. Quasi-still moments (foot planted) = zero velocity (ZUPT). Each swing between two of them is
      integrated with linear drift removal -> true height change dz and distance dd of that stride.
      Comparing planted moment to planted moment cancels the up-and-down arc of the swing.
   3. Terrain = grade over the last 3 strides; stairs = 2 strides in a row with a big, steep rise.
   4. Slip = Earth-horizontal acceleration averaged over 130 ms >= research threshold, right after landing,
      while the foot is not swinging (low rotation).                                                     */
const qmul=(a,b)=>[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qnorm=q=>{const l=Math.hypot(q[0],q[1],q[2],q[3])||1;return[q[0]/l,q[1]/l,q[2]/l,q[3]/l];};

const TERR={flat:'Flat ground',up:'Uphill','steep-up':'Steep uphill',down:'Downhill','steep-down':'Steep downhill','stairs-up':'Stairs up','stairs-down':'Stairs down'};
const TERR_SAY={up:'Uphill.','steep-up':'Steep uphill. Short steps, lean forward.',down:'Downhill. Shorter steps.','steep-down':'Steep downhill. Slow down and take short steps.','stairs-up':'Stairs going up.','stairs-down':'Stairs going down. Hold the rail.',flat:'Flat ground again.'};
const SLIP_B=22;
const NAV={gh:[],v:[0,0,0],vpk:0,dir:[1,0],landed:false,vmin:0,ready:false,q:[1,0,0,0],bias:[0,0,0],g:9.81,ei:[0,0,0],quietMs:0,still:true,buf:[],peakW:0,strides:[],sw:[],lastImpact:-1e9,landT:-1e9,pend:null,pendN:0,grade:0,last:null};

const NAVTH=()=>S.mount==='sock'?{w:1.6,a:1.5}:{w:0.6,a:1.0};   // quasi-still limits: rad/s, m/s²
function navStep(f,w0,dt,t){
 const w=[w0[0]-NAV.bias[0],w0[1]-NAV.bias[1],w0[2]-NAV.bias[2]];

 const quiet=wm<th.w&&Math.abs(fm-NAV.g)<th.a;NAV.quietMs=quiet?NAV.quietMs+dt*1000:0;

 // moves at  v = ω × (r · shin axis)  with r ≈ 10 cm (phone centre above the ankle). Shoe mount: r = 0.
 // ---- slip: after the foot has landed (swing over, speed low), it SPEEDS UP again with little rotation.
 //      A normal landing only slows the foot down; a slip accelerates it 0.1 -> 1.87 m/s in ~130 ms.

   const rise=fwd>0?fwd-Math.max(0,NAV.vmin):0;if(NAV.landed&&rise>live.slideMax)live.slideMax=rise;
   if(rise>=0.8&&hAvg>=SLIP_TH&&wAvg<2.6&&t-lastSlip>2500){lastSlip=t;NAV.sw=[];NAV.landed=false;slip('sensor');}}}
 // ---- strides: planted -> swing -> planted ----
 if(planted){if(!NAV.still){NAV.still=true;navSwingEnd(t);}}
 if(S.sensUp&&t-NAV.lastSw>3000)setClimb(false);   // stopped at the top of the stairs
 else{
  if(NAV.still&&!quiet){NAV.still=false;NAV.buf=[];NAV.peakW=0;NAV.v=[0,0,0];NAV.landed=false;NAV.vpk=0;NAV.dir=[1,0];navSwingStart(t);}
  if(!NAV.still){NAV.buf.push([aw[0],aw[1],aw[2],dt]);if(wm>NAV.peakW)NAV.peakW=wm;

function navSwingStart(t){closeStance();}
/* Step counter for a phone on the shin / in the sock: every stride of the right leg makes ONE big
   swing of the shin (gyroscope 150–400 °/s), while standing, turning or fidgeting stays far lower.
   Research: shank gyroscope is the most reliable signal for gait events. One swing = 2 steps.     */
const SW={lp:0,on:false,peak:0,t0:0,last:-1e9};
function swingStep(gyroDeg,t){SW.lp+=(gyroDeg-SW.lp)*0.35;
 if(!SW.on){if(SW.lp>110&&t-SW.last>450){SW.on=true;SW.peak=SW.lp;SW.t0=t;}}
 else{if(SW.lp>SW.peak)SW.peak=SW.lp;
  if(SW.lp<Math.max(70,0.45*SW.peak)){SW.on=false;   // real data: the shin still turns 60–100 °/s while planted
  const dur=t-SW.t0;if(SW.peak>=140&&dur>=100&&dur<=900){SW.last=t;stride(t);}}
  else if(t-SW.t0>1500)SW.on=false;}}
// Each swing between two planted moments is integrated with zero velocity at both ends (ZUPT).
// A phone on the shin is never perfectly still when planted, which leaves a small, steady bias per
// stride: it is learned while walking on flat ground right after calibration, then subtracted (NAV.tb).
function navSwingEnd(t){const b=NAV.buf;NAV.buf=[];let T=0;for(const x of b)T+=x[3];
 S.stanceStartT=t;stanceSamples=[];   // steps are counted by swingStep(), not here
 if(T<0.2||T>2.5||NAV.peakW<2.6)return;            // shuffle or fidget, not a stride
 const ve=[0,0,0];for(const x of b)for(let i=0;i<3;i++)ve[i]+=x[i]*x[3];

 for(const x of b){tt+=x[3];for(let i=0;i<3;i++){v[i]+=x[i]*x[3];p[i]+=(v[i]-ve[i]*tt/T)*x[3];}}

 if(!ok)return;if(NAV.warm>0){NAV.warm--;return;}   // first strides: attitude still settling
 if(NAV.learn.length<5){NAV.learn.push(dz/dd);if(NAV.learn.length===5){NAV.tb=Math.max(-0.08,Math.min(0.08,median(NAV.learn)));toast('Ready · terrain tracking on');}return;}   // flat-ground walk calibration

// sock mount, tested on real stairs data: climbing = several strides in a row that each rise 20–160 cm
// at a slower cadence (>1.3 s per stride) than flat walking (~1.1 s). Flat walking never gave 4 in a row.
function climbCheck(t,dz,dd){const gap=t-(NAV.lastSw||-1e9);NAV.lastSw=t;if(S.mount!=='sock')return;

function setClimb(on){if(on===!!S.sensUp)return;S.sensUp=on;NAV.noClimb=0;

function classifyTerrain(){

 const r=NAV.strides.slice(-3);if(r.length<2)return;let sd=0,sz=0;for(const x of r){sd+=x.dd;sz+=x.dz;}if(sd<1)return;

let clk=0,lastEvT=0;
function onMotion(e){
 const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;sensorsSeen=true;
 const now=performance.now();let dt=(now-lastEvT)/1000;lastEvT=now;
 if(!(dt>0.002&&dt<0.1))dt=(e.interval>1&&e.interval<100?e.interval:10)/1000;   // first event or burst
 clk=clk?clk+dt*1000:now;const t=clk;
 const r=e.rotationRate||{};
 const gyro=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0);         // deg/s
 const wv=[(r.beta||0)*D2R,(r.gamma||0)*D2R,(r.alpha||0)*D2R];  // body x,y,z in rad/s
 const fv=[g.x,g.y,g.z];

 const k=gyro<40?.2:.05;grav.x+=(g.x-grav.x)*k;grav.y+=(g.y-grav.y)*k;grav.z+=(g.z-grav.z)*k;

 if(calibBuf){if(!calibBuf.skip){calibBuf.x+=g.x;calibBuf.y+=g.y;calibBuf.z+=g.z;calibBuf.n++;if(calibPhase==='still'){calibBuf.gx+=wv[0];calibBuf.gy+=wv[1];calibBuf.gz+=wv[2];}}return;}
 if(!calib||!S.started||emer)return;

 const rp=Math.atan2(dot(gn,calib.f),c0)*57.2958, rr=Math.atan2(dot(gn,calib.s),c0)*57.2958;

 if(tab==='ar'&&!xrState)arStepDetect(mag,t);
 // ---- auto-pause when the phone is picked up (held upright to look at it) ----
 if(S.mount==='shoe'&&Math.abs(rp)>55&&gyro<120){if(!handT)handT=t;if(!S.paused&&t-handT>900){S.paused=true;fallCand=0;tiltStill=0;stanceSamples=[];refreshLive();}}else handT=0;
 if(S.paused){if(Math.abs(rp)<25&&Math.abs(rr)<25){if(!flatT)flatT=t;if(t-flatT>1000){S.paused=false;flatT=0;NAV.quietMs=0;refreshLive();}}else flatT=0;return;}

// The foot/ankle is planted for a moment every step. Its side tilt there = how the foot sits (rolling / uneven ground).
function closeStance(){const s=stanceSamples;stanceSamples=[];if(s.length<3)return;s.sort((x,y)=>x.g-y.g);const q=s.slice(0,Math.max(3,Math.floor(s.length/3)));

 S.stancePitch.push(p);S.stanceRoll.push(r);S.pron.push(S.foot==='right'?r:-r);
 for(const k of ['stancePitch','stanceRoll','pron'])if(S[k].length>200)S[k].shift();

function stride(t){let pk={mag:0,rp:0};for(const s of buf)if(t-s.t<400&&s.mag>pk.mag)pk=s;

function addStride(type,impact,t){
 S.lastStepT=Date.now();if(S.onBreak){S.onBreak=false;toast('Welcome back');}
 if(S.check&&S.check.kind==='rest')closeCheck();
 if(type==='heel'&&impact>2.8)S.heelRun++;else S.heelRun=0;
 if(S.heelRun>=4){S.heelRun=0;if(S.coachOn){if(S.alertMode==='earbuds')speak('Coach: land softer. Take shorter steps.');toast('Coach · land softer, shorter steps');}}

function updateUneven(){const rr=S.stanceRoll.slice(-4);if(rr.length<4)return;const m=avg(rr);live.unev=Math.sqrt(avg(rr.map(x=>(x-m)**2)));}   // measured for the debug panel only: no alerts on flat or rocky ground
function setSlopeState(s){if(s===S.slope)return;const prev=S.slope;S.slope=s;

 if(say){if(S.alertMode==='earbuds')speak(say);toast((s==='flat'?'Flat ground':(steep?'Steep ':'')+(s==='up'?(steep?'uphill':'Uphill'):(steep?'downhill':'Downhill')))+(NAV.grade&&s!=='flat'&&!S.slopeForced?` · ${Math.round(Math.abs(NAV.grade)*100)}% grade`:''));}

/* ================= trail / hazards ================= */
const totalM=()=>S.steps*STEP_LEN+S.offset;
const pos=()=>((totalM()%TRAIL_M)+TRAIL_M)%TRAIL_M;
const lap=()=>Math.floor(totalM()/TRAIL_M);
function ahead(h){let d=h.pos-pos();if(d<=0)d+=TRAIL_M;return d;}
// what the route says is under you now (reported by others): inside the 10 m after a pin
function routeNow(){for(const h of S.hazards){if(!['up','down','slope'].includes(h.type))continue;const d=pos()-h.pos;if(d>=0&&d<10)return h.type==='down'?'down':'up';}return'flat';}
const terrainNow=()=>S.slopeForced||(S.mount==='sock'?(S.sensUp?'up':routeNow()):S.slope);
function nextHazard(){let best=null;for(const h of S.hazards)if(ALERT_TYPES.includes(h.type)&&(!best||ahead(h)<ahead(best)))best=h;return best;}
function checkHazards(){const L=lap();for(const h of S.hazards){if(!ALERT_TYPES.includes(h.type))continue;const d=h.pos-pos();
 if(d>ALERT_M&&d<=EARLY_M&&h.earlyLap!==L){h.earlyLap=L;alertHazard(h,d,true);}
 else if(d>0&&d<=ALERT_M&&h.lap!==L){h.lap=L;h.earlyLap=L;alertHazard(h,d,false);}}}
const EARLY={ice:'Ice in about 20 metres.',up:'Uphill in about 20 metres.',down:'Downhill in about 20 metres.',slope:'Steep slope in about 20 metres.'};
const MSG={ice:'Ice ahead. Slow down and take short, flat steps.',up:'Uphill ahead. Short steps.',down:'Downhill ahead. Slow down.',slope:'Steep slope ahead. Take it easy.',uneven:'Rocky ground ahead. Watch your step.'};
const HCOL={ice:'#B3261E',up:'#A84E0A',down:'#2A5DB8',slope:'#A84E0A',uneven:'#6B3FD1'};
function alertHazard(h,d,early){
 if(!S.sharing){toast('Hazard ahead, but terrain alerts are off. Turn on sharing in Map.');return;}
 S.banner={title:early?`${h.label} coming up`:`${h.label} ahead`,sub:`in ${d.toFixed(0)} m`,msg:(early?EARLY[h.type]:MSG[h.type])||MSG.ice,color:HCOL[h.type]||C.red};
 S.pulseId=h.id;
 if(S.alertMode==='earbuds'){chime();speak(S.banner.msg);}else{chime();}
 clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>{S.banner=null;S.pulseId=null;render();},8000);render();}
function skipToHazard(){let h=null;for(const x of S.hazards)if(ALERT_TYPES.includes(x.type)&&(!h||ahead(x)<ahead(h)))h=x;if(!h)return;S.offset+=ahead(h)-(ahead(h)>EARLY_M?EARLY_M:ALERT_M);h.lap=-1;h.earlyLap=-1;checkHazards();render();}
function slip(src){S.slips++;let hid=null;
 if(S.sharing){hid=S.nextId++;S.hazards.push({id:hid,pos:Math.max(1,pos()),type:'ice',label:'Slip here · possible ice',reports:1,lap:lap()});}
 chime();speak('Did you slip, or did you just pause?');openCheck({kind:'slip',hid});render();}
/* ---- quick questions (like Google Maps asks). No answer = escalate, but only if you also didn't move ---- */
let checkTimer=null;
const CHECK_T={slip:12000,rest:30000,breakover:30000,late:60000};   // safety checks only (WCAG 2.2.1 'essential' exception); other prompts wait for you
function openCheck(c){c.t0=Date.now();S.check=c;clearTimeout(checkTimer);
 if(c.kind==='rest')speak('You stopped moving. Did you fall?');if(c.kind==='breakover')speak('Your pause is over. Are you okay?');if(c.kind==='late')speak('Are you running late?');
 if(CHECK_T[c.kind])checkTimer=setTimeout(()=>{if(S.check!==c)return;const moved=S.lastStepT>c.t0;closeCheck();
  if(c.kind==='slip'){if(moved)toast('Saved · others will be warned here');else fall('slip');}
  else if(c.kind==='rest'){if(!moved)fall('still');}
  else if(c.kind==='breakover'){if(!moved)fall('break');}
  else if(c.kind==='late')fall('late');
  else if(c.kind==='breakpick')startBreak(15);},CHECK_T[c.kind]);

function closeCheck(){S.check=null;clearTimeout(checkTimer);renderCheck();}
function renderCheck(){const el=document.getElementById('check');setTimeout(()=>a11yPass(el),0);const c=S.check;if(!c||emer){el.innerHTML='';return;}

/* ================= audio ================= */
let actx=null;
function chime(){try{actx=actx||new AudioContext();const t=actx.currentTime;[[880,0],[1318.5,.18]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.2,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.6);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.65);});}catch(e){}}
function speak(m,delay=500){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.lang='en-US';u.rate=.95;setTimeout(()=>speechSynthesis.speak(u),delay);}catch(e){}}

/* ================= emergency ================= */
/* ================= SAFETY: when to alert family / 911 =================
   Every situation has its own question and its own escalation. A step taken at any point
   means "I'm fine" for the quiet checks. Family always get: what happened, when Ryan last moved,
   exact GPS position (with accuracy), battery level and a live-map link. */
const WHY={
 fall: {t:'Are you okay?',s:'We felt a hard fall.',e1:20,e2:45,msg:'had a hard fall and is not answering'},
 sos:  {t:'Need help?',s:'Tap “Get help now” to send your location.',e1:20,e2:45,msg:'pressed SOS'},
 slip: {t:'Are you okay?',s:'You slipped and haven’t moved since.',e1:20,e2:60,msg:'slipped, has not moved since and is not answering'},
 still:{t:'Did you fall?',s:'You stopped moving and didn’t answer.',e1:30,e2:120,msg:'stopped moving and is not answering'},
 break:{t:'Is everything okay?',s:'Your pause is over and you haven’t moved.',e1:30,e2:180,msg:'paused longer than planned, has not moved and is not answering'},
 late: {t:'Running late?',s:'You haven’t reached your destination.',e1:60,e2:null,msg:'has not reached their destination on time and is not answering'}};
function familyText(src){const w=WHY[src]||WHY.fall;const mv=S.lastStepT?Math.max(0,Math.round((Date.now()-S.lastStepT)/60000)):0;
 const loc=S.fix?`${S.fix.lat.toFixed(5)}, ${S.fix.lon.toFixed(5)} (±${Math.round(S.fix.acc)} m)`:`${S.dest||'River Valley Trail'}, ${(S.steps*STEP_LEN).toFixed(0)} m along`;
 return`SoleMate: Ryan ${w.msg}. Last moved ${mv?mv+' min ago':'just now'}. Location: ${loc}. Battery ${S.batLevel!=null?Math.round(S.batLevel*100)+'%':'unknown'}. Live map: solemate.app/r/ryan`;}
const nowHM=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function fall(src){if(emer)return;closeCheck();const w=WHY[src]||WHY.fall;emer={state:'ask',stage:0,src,w,t0:Date.now(),last:-99};alarmTick();emer.iv=setInterval(alarmTick,1000);renderOverlay();}
function alarmTick(){if(!emer||emer.state!=='ask')return;const e=(Date.now()-emer.t0)/1000,w=emer.w;
 if(e-emer.last>=6){emer.last=e;chime();speak(emer.stage?'Are you okay? We told your family. Tap I am okay.':w.t+' Tap I am okay.',350);}
 if(e>=w.e1&&emer.stage<1){emer.stage=1;S.alertsSent.unshift(nowHM());renderOverlay();}
 if(w.e2&&e>=w.e2&&emer.stage<2)helpNow();}
function helpNow(){if(!emer)return;clearInterval(emer.iv);if(emer.stage<1)S.alertsSent.unshift(nowHM());emer.stage=2;emer.state='sent';
 speak('Help is on the way. Emma, Mom and emergency services have your location.',100);renderOverlay();}
function okFall(){if(!emer)return;clearInterval(emer.iv);const told=emer.stage>=1;emer=null;S.lastStepT=Date.now();speak('Okay. Glad you are fine.',100);if(told)toast('We told Emma and Mom you’re okay');renderOverlay();render();}
function slipFine(){if(!emer)return;clearInterval(emer.iv);emer=null;S.slips++;S.lastStepT=Date.now();toast('Logged as a slip · glad you’re okay');renderOverlay();render();}
function breakFromFall(){if(!emer)return;clearInterval(emer.iv);emer=null;renderOverlay();openCheck({kind:'breakpick'});}
function lowBattery(){if(S.batSent)return;S.batSent=true;S.alertsSent.unshift(nowHM());toast('Battery low · your last location was sent to Emma & Mom');speak('Battery low. Your last location was sent to Emma and Mom.');}
// background watcher (every second)
setInterval(()=>{if(!S.started||emer||calibBuf)return;const now=Date.now();
 if(S.onBreak){if(S.breakUntil&&now>S.breakUntil&&!S.check)openCheck({kind:'breakover'});return;}
 if(!S.check&&S.steps>0&&S.lastStepT&&now-S.lastStepT>90000)openCheck({kind:'rest'});
 if(S.eta&&now>S.eta&&!S.lateAsked&&!S.check){S.lateAsked=true;openCheck({kind:'late'});}
 if(S.batLevel!=null&&S.batLevel<0.1)lowBattery();},1000);


/* ================= analysis ================= */
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function analysis(){const n=S.strikes.heel+S.strikes.mid+S.strikes.fore;const now=performance.now();
 const cad=S.strides.filter(t=>now-t<15000).length*2*4;
 const imp=avg(S.impacts),pr=avg(S.pron);
 const iv=[];for(let i=1;i<S.strides.length;i++){const d=S.strides[i]-S.strides[i-1];if(d<3000)iv.push(d);}
 const m=avg(iv),cv=iv.length>2?Math.sqrt(avg(iv.map(x=>(x-m)**2)))/m:0;
 let score=null;if(n>=2){score=100-(n?S.strikes.heel/n:0)*12-Math.max(0,imp-2.2)*10-Math.max(0,Math.abs(pr)-5)*2.2-Math.min(cv,.5)*50-S.slips*4;score=Math.round(Math.max(40,Math.min(98,score)));}
 const strike=!n?'—':S.strikes.heel>=S.strikes.mid&&S.strikes.heel>=S.strikes.fore?'Heel':S.strikes.fore>S.strikes.mid?'Forefoot':'Midfoot';
 const rolling=!S.pron.length?'—':pr>6?'Rolling in':pr<-6?'Rolling out':'Neutral';
 const landing=!S.impacts.length?'—':imp>2.8?'Hard':imp>1.8?'Medium':'Soft';
 let status='Waiting for steps',sc='#68635B';if(score!==null){if(score>=80){status='Form: good';sc=C.green}else if(score>=62){status='Form: watch it';sc=C.orange}else{status='Form: needs work';sc=C.red}}
 // estimated pressure map from motion
 const hs=n?S.strikes.heel/n:.33,fs=n?S.strikes.fore/n:.2;let heel=.25+hs*.5,toe=.18+fs*.5+(S.slope.includes('up')?.15:0),inner=.3+Math.max(-.2,Math.min(.2,pr*.02)),outer=.3-Math.max(-.2,Math.min(.2,pr*.02));
 const tot=heel+toe+inner+outer;const share={heel:heel/tot,toe:toe/tot,inner:inner/tot,outer:outer/tot};
 return{n,cad,imp,pr,cv,score,strike,rolling,landing,status,sc,share};}

const PTS=[[34,350],[62,298],[108,262],[146,226],[166,176],[214,146],[246,96],[282,36]];
const SEGL=(()=>{const L=[0];for(let i=1;i<PTS.length;i++)L.push(L[i-1]+Math.hypot(PTS[i][0]-PTS[i-1][0],PTS[i][1]-PTS[i-1][1]));return L})();
function at(m){const f=Math.max(0,Math.min(1,m/TRAIL_M))*SEGL[SEGL.length-1];for(let i=1;i<PTS.length;i++)if(f<=SEGL[i]){const t=(f-SEGL[i-1])/(SEGL[i]-SEGL[i-1]);return[PTS[i-1][0]+(PTS[i][0]-PTS[i-1][0])*t,PTS[i-1][1]+(PTS[i][1]-PTS[i-1][1])*t];}return PTS[PTS.length-1];}

/* ================= AR footprints =================
   Real AR (Android Chrome, WebXR): the camera finds the actual floor (hit-test), footprints are laid
   ON it in world space, so they stay put when you move. New ones keep appearing ahead as you walk
   (only within ~6 m of you, fading in), like fresh prints in front of you.
   Fallback (other phones): the camera view + a ground plane computed from the phone's tilt and
   compass; your own steps (phone in hand) move you along the trail.                                 */
let fpImgs=null;
function fpCanvas(right){const c=document.createElement('canvas');c.width=96;c.height=240;const x=c.getContext('2d');
 x.translate(48,120);if(right)x.scale(-1,1);
 x.fillStyle='rgba(46,38,31,.9)';
 x.beginPath();x.ellipse(4,-50,30,56,-0.1,0,Math.PI*2);x.fill();          // ball of the foot
 x.beginPath();x.ellipse(-3,66,22,40,0.06,0,Math.PI*2);x.fill();          // heel
 x.beginPath();x.moveTo(-20,4);x.quadraticCurveTo(-8,34,-22,66);x.lineTo(16,66);x.quadraticCurveTo(12,24,26,0);x.closePath();x.fill();  // arch

 for(let y=-104;y<106;y+=13){x.beginPath();x.moveTo(-36,y);x.lineTo(36,y+7);x.stroke();}                     // tread lines
 x.lineWidth=2.5;for(let y=-96;y<100;y+=26){x.beginPath();x.arc(0,y,10,0,Math.PI*2);x.stroke();}
 x.globalCompositeOperation='destination-in';const g=x.createRadialGradient(0,8,30,0,8,128);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.75,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');

const TRAIL_STEP=0.38,REVEAL=6;
function trailPt(i){const s=1.2+i*TRAIL_STEP;return{s,lat:(i%2?0.09:-0.09)+0.35*Math.sin(s*0.33),tan:0.35*0.33*Math.cos(s*0.33),right:i%2===1};}
function arLoop(){if(tab!=='ar'||xrState){arLoopOn=false;return;}arLoopOn=true;requestAnimationFrame(arLoop);

 if(cv.width!==W*2){cv.width=W*2;cv.height=H*2;}const x=cv.getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,W,H);

 const beta=devBeta==null?62:Math.max(15,Math.min(88,devBeta));      // 90 = phone upright, looking at the horizon
 const th=(90-beta)*D2R,h=1.35,f=W*1.05,cx=W/2,cy=H/2;   // f: ~50° horizontal view, like a phone camera in portrait

 const yaw=heading!=null&&arBear[k]!=null?(((arBear[k]-heading+540)%360)-180)*D2R:0;
 const proj=(al,lt)=>{const X=al*Math.sin(yaw)+lt*Math.cos(yaw),Z=al*Math.cos(yaw)-lt*Math.sin(yaw);const d=Z*Math.cos(th)+h*Math.sin(th);if(d<0.25)return null;
  return{x:cx+f*X/d,y:cy+f*(h*Math.cos(th)-Z*Math.sin(th))/d,d};};
 const now=performance.now(),items=[];
 for(let i=0;i<60;i++){const p=trailPt(i),al=p.s-arWalk;if(al<0.3||al>REVEAL+0.5)continue;
  const a=Math.min(1,(REVEAL-al)/0.8)*Math.min(1,(al-0.3)/0.4);if(a<=0)continue;
  if(!arSeen[i])arSeen[i]=now;const pop=Math.max(0,1-(now-arSeen[i])/350);

 for(const it of items){x.save();x.globalAlpha=it.a;x.translate(it.cxp,it.cyp);x.rotate(it.ang);x.drawImage(it.img,-it.wd/2,-it.len/2,it.wd,it.len);x.restore();}

async function startXR(){const k=S.arTarget;if(!k)return;let THREE;

 calibrate();}

 const iv=setInterval(()=>{n--;setCalN(n);if(n>0)return;clearInterval(iv);
  const ok0=calibBuf.n>5, g0=ok0?norm([calibBuf.x,calibBuf.y,calibBuf.z]):[0,0,1];
  const f0=ok0?[calibBuf.x/calibBuf.n,calibBuf.y/calibBuf.n,calibBuf.z/calibBuf.n]:[0,0,9.81], gb=ok0?[calibBuf.gx/calibBuf.n,calibBuf.gy/calibBuf.n,calibBuf.gz/calibBuf.n]:[0,0,0];
  calibBuf={x:0,y:0,z:0,n:0,gx:0,gy:0,gz:0,skip:true};calibPhase='lean';renderOverlay();

   calib=buildCalib(g0,g1);calibBuf=null;calibPhase=null;navInit(f0,gb);toast('Walk about 10 steps on flat ground to finish setup');speak('Now walk about ten steps on flat ground.');S.stancePitch=[];S.stanceRoll=[];
   renderOverlay();render();

 else if(a==='sharing')S.sharing=!S.sharing;
 else if(a==='buddy')S.buddy=!S.buddy;
 else if(a.startsWith('b-')){const k=a.slice(2);S.buddies[k]=!S.buddies[k];}
 else if(a==='doctor')toast('Private link created for your doctor · expires in 7 days');
 // report
 else if(a.startsWith('per-')){S.period=a.slice(4);S.repDate=null;}
 else if(a==='rep-today')S.repDate=null;
 // map
 else if(a.startsWith('pin-')&&a!=='pin-close'){S.mapSel=+a.slice(4);if(tab==='buddy'){const h=S.hazards.find(x=>x.id===S.mapSel);if(h){const q=at(h.pos);S.mapPan=[-(q[0]-158)*S.mapZoom,-(q[1]-195)*S.mapZoom];}}}
 else if(a==='pin-close'){S.mapSel=null;}
 else if(a==='saferoute')S.safeRoute=!S.safeRoute;
 else if(a==='zin')S.mapZoom=Math.min(3,+(S.mapZoom*1.4).toFixed(2));
 else if(a==='zout')S.mapZoom=Math.max(.7,+(S.mapZoom/1.4).toFixed(2));
 else if(a==='zme')centerMe();
 else if(a.startsWith('pan-')){const d=a.slice(4),k=40;S.mapPan=[S.mapPan[0]+(d==='l'?k:d==='r'?-k:0),S.mapPan[1]+(d==='u'?k:d==='d'?-k:0)];}
 // group
 else if(a==='grp-create')createGroup();
 else if(a==='grp-scan'){startScan();return;}
 else if(a==='scan-cancel'){stopScan();return;}
 else if(a==='grp-qr'){S.showQR=!S.showQR;if(S.showQR)loadQR();}
 else if(a==='grp-leave'){toast(S.trek&&S.trek.admin==='You'?'Group ended':'You left the group');joinTimers.forEach(clearTimeout);S.trek=null;S.msgs=[];S.arTarget=null;S.mapPerson=null;}
 else if(a.startsWith('vis-')){const[,k,m]=a.split('-');if(S.trek){S.trek.vis[k]=m;toast(m==='hide'?`${k} can’t see you`:m==='loc'?`${k} sees your location only`:`${k} sees your footsteps in AR`);}}
 else if(a.startsWith('add-')){const k=a.slice(4);if(S.trek&&!S.trek.members.includes(k)){S.trek.members.push(k);S.trek.vis[k]='loc';if(k==='Emma'&&!S.msgs.length)S.msgs.push({id:Date.now(),from:'Emma',text:'Icy patch by the bridge!',pos:(pos()+PEOPLE.Emma.d*.6)%TRAIL_M});toast(`${k} added · you see each other’s footprints`);}}
 else if(a.startsWith('rm-')){const k=a.slice(3);if(S.trek&&S.trek.admin==='You'){S.trek.members=S.trek.members.filter(x=>x!==k);delete S.trek.vis[k];if(S.arTarget===k)S.arTarget=null;toast(`${k} removed from the group`);}}
 else if(a.startsWith('find-')){S.arTarget=a.slice(5);arWalk=0;arSeen={};S.mapPerson=null;S.tabHist.push(tab);tab='ar';}
 // AR
 else if(a==='arx-pin'){S.msgs.push({id:Date.now(),from:'You',text:'📍 I’m here',pos:pos()});toast('Pin dropped · it shows on the group map');}
 else if(a==='arx-ping'){toast(`Ping sent to ${S.arTarget}`);speak(`Ping sent to ${S.arTarget}.`,100);return;}
 else if(a==='mytrail')S.myTrail=!S.myTrail;
 else if(a.startsWith('ar-')){S.arTarget=a.slice(3);arWalk=0;arSeen={};}
 // demo
 else if(a==='d-step'){addStride('mid',1.6);}
 else if(a==='d-heel'){addStride('heel',3.3);}
 else if(a==='d-slip'){demoSheet(false);slip('demo');return;}
 else if(a==='d-rest'){demoSheet(false);openCheck({kind:'rest'});return;}
 else if(a==='d-hazard'){demoSheet(false);skipToHazard();return;}
 else if(a==='d-up'||a==='d-down'){S.slopeForced=a==='d-up'?'up':'down';setSlopeState(S.slopeForced);demoSheet(true);}
 else if(a==='d-flat'){S.slopeForced=null;setSlopeState('flat');demoSheet(true);}
 else if(a.startsWith('slip-')){SLIP_TH=parseFloat(a.slice(5));demoSheet(true);}
 else if(a.startsWith('len-')){STEP_LEN=parseFloat(a.slice(4));demoSheet(true);}
 else if(a==='d-recal'){demoSheet(false);calibrate();return;}
 else if(a==='d-reset'){const f=S.foot,mt=S.mount,dst=S.dest;S=fresh();S.foot=f;S.mount=mt;S.started=true;setDest(dst||'River Valley Trail');NAV.strides=[];NAV.pend=null;NAV.grade=0;demoSheet(false);closeCheck();}
 render();});
document.addEventListener('change',e=>{if(e.target.id==='repDate'){S.repDate=e.target.value||null;render();setTimeout(()=>{const i=document.getElementById('repDate');if(i)i.focus();},0);}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='brkIn'){e.preventDefault();document.querySelector('[data-act=brk-go]').click();return;}if(e.key==='Escape'){if(document.getElementById('sheet').classList.contains('open')){demoSheet(false);return;}if(S.check&&S.check.kind==='compose'){closeCheck();return;}}if(e.key==='Enter'&&e.target.id==='msgIn'){e.preventDefault();document.querySelector('[data-act=compose-send]').click();return;}if(e.key==='Enter'&&e.target.id==='destIn'){e.preventDefault();document.querySelector('[data-act=dest-go]').click();}});
(()=>{const u=new URLSearchParams(location.search);const c=u.get('join');if(c)S.pendingJoin=[c,u.get('by')||'Admin',u.get('g')];})();
render();
</script>
</body>
</html>
