<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>SoleMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3EF;--ink:#121214;--mute:#57575C;--soft:#333;--teal:#12666B;--tealSoft:rgba(238,115,70,.16);--red:#B3261E;--orange:#A84E0A;--green:#2A7A47;--blue:#2A5DB8;--sh:0 8px 24px rgba(0,0,0,.07)}
/* hide anything injected outside the app (e.g. the 'Powered by Netlify' badge) so it can't cover the menu */
body>*:not(#app):not(script){display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.content{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;display:flex;flex-direction:column;gap:12px}
.nav{display:flex;justify-content:space-around;padding:10px 6px calc(env(safe-area-inset-bottom) + 12px);background:#fff;box-shadow:0 -6px 18px rgba(0,0,0,.05)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#68635B;padding:4px 10px}
.nav svg{width:22px;height:22px}
.nav button.sel{color:var(--teal)}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hT{font-size:26px;font-weight:800;letter-spacing:-.035em}
.hS{font-size:13px;color:var(--mute);margin-top:2px}
.card{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px}
.ctitle{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.small{font-size:12.5px;color:var(--mute);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:var(--sh);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.dark{background:var(--ink);color:#fff;box-shadow:none}
.pill.soft{background:var(--soft);box-shadow:none}
.d{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:flex;justify-content:space-between}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.04em}
.stat span{font-size:12px;color:var(--mute)}
.btn{padding:14px 18px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;text-align:center}
.btn.dark{background:var(--ink);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;padding:10px 6px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.sel{background:#fff;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.banner{border-radius:22px;padding:16px;color:#fff;display:flex;gap:12px;align-items:center;animation:pop .35s ease}
.banner b{display:block;font-size:17px;letter-spacing:-.01em}
.banner span{font-size:12.5px;opacity:.92}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.toggle{width:48px;height:29px;border-radius:99px;background:#8A847B;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--ink)}.toggle.on::after{left:22px}
.lrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.lrow .tx{flex:1;min-width:0}.lrow .tx b{display:block;font-size:14.5px}.lrow .tx span{font-size:12.5px;color:var(--mute)}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.big{font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1}
.ai{background:var(--tealSoft);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:12px 14px}
.mini b{display:block;font-size:17px;letter-spacing:-.02em}.mini span{font-size:11.5px;color:var(--mute)}
.risk{background:#FFF4E8;border-radius:20px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.toast{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);background:var(--ink);color:#fff;border-radius:18px;padding:13px 15px;font-size:13px;font-weight:500;z-index:40;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.over{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:16px}
.over .h3{font-size:28px;letter-spacing:-.035em}
.ring{width:190px;height:190px;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;font-weight:800;letter-spacing:-.04em}
.ring .n small{font-size:13px;font-weight:500;letter-spacing:0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);z-index:35;box-shadow:0 -10px 30px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .3s}
.sheet.open{transform:none}
.sheet .grid2 .btn{padding:13px 10px;font-size:13px}
.debug{font:12px ui-monospace,Menlo,monospace;color:var(--mute);display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.arwrap{position:absolute;inset:0;background:#3b4245;overflow:hidden}
.arwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fp{animation:fp 2.4s infinite}
@keyframes fp{0%{opacity:0}20%{opacity:1}80%{opacity:.9}100%{opacity:0}}
.pulse{animation:pulse 1.2s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.mount{display:flex;gap:12px;align-items:flex-start;text-align:left}
.nav .sosb{width:58px;height:58px;margin-top:-26px;padding:0;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:15px;letter-spacing:.04em;box-shadow:0 8px 20px rgba(219,69,56,.45),0 0 0 5px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}
.nav .sosb small{font-size:9px;font-weight:600;letter-spacing:0;opacity:.9}
.nav button{padding:4px 4px}
.check{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:28;background:var(--ink);color:#fff;border-radius:22px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:pop .3s ease}
.check b{font-size:16px;display:block}.check p{font-size:12.5px;opacity:.8;margin:3px 0 12px}
.check .row button{flex:1;padding:11px 8px;border-radius:99px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700;color:#fff}
.check .row button.w{background:#fff;color:#fff}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:99px}
.brow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin-top:8px}.brow span{width:92px;color:var(--mute)}.brow b{width:28px;text-align:right;font-size:12.5px}
.ladder{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.ladder div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22);font-size:13.5px;font-weight:600}
.ladder div.on{background:#fff;color:var(--red)}.ladder div.done{opacity:.6}
.ladder .k{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.beat{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mapbtns{position:absolute;right:14px;top:14px;display:grid;grid-template-columns:32px 32px;gap:5px}
.mapbtns button{width:32px;height:32px;border-radius:12px;background:#fff;box-shadow:var(--sh);font-size:18px;font-weight:700}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12.5px}.leg div{display:flex;gap:8px;align-items:flex-start}.leg b{display:block;font-size:13px}.leg span{color:var(--mute);font-size:11.5px}
#xrUI button{pointer-events:auto}
.btn.sm{padding:8px 12px;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.mount .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
/* ---- WCAG 2.2 AA ---- */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid #12666B;outline-offset:2px;border-radius:12px}
.over :focus-visible,.check :focus-visible,.banner :focus-visible{outline-color:#fff}
.content{scroll-padding-bottom:140px;scroll-padding-top:20px}
h1,h2,h3{font:inherit}
input{border:1.5px solid #8A847B!important}
input:focus-visible{border-color:#12666B!important}
.seg button.sel{font-weight:700}
.seg button,.nav button,.pill,.btn{min-height:24px;min-width:24px}
.ladder div.done{opacity:1}
.ladder div.done .k{background:#fff;color:#B3261E}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.sos-big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--red);color:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 24px rgba(179,38,30,.3)}
.sos-big .sos-c{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--red);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.sos-big b{display:block;font-size:19px}.sos-big span span{font-size:13px}
.pm{width:36px;height:36px;border-radius:50%;background:rgba(210,63,47,.22);color:var(--red);font-size:22px;font-weight:700;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.pm.add{background:rgba(238,115,70,.16);color:var(--teal)}
.backb{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:20px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center;margin-right:10px}
.hdr{align-items:center}

/* ===== Bento dark theme (hi-fi v2): black background, solid colour tiles, Rubik ===== */
:root{--bg:#0B0B0B;--card:#232323;--soft:#333333;--mute:rgba(255,255,255,.64);--coral:#EE7346;--yel:#FFD84D;--offw:#F5F5F2;--on:#111111;--teal:#EE7346;--tealSoft:rgba(238,115,70,.16);--red:#D23F2F;--sh:none}
html,body,.app{background:#0B0B0B}
body{font-family:Rubik,system-ui,sans-serif;color:#fff}
.content{padding:calc(env(safe-area-inset-top) + 12px) 20px 124px;gap:12px}
.hT{font-size:30px;font-weight:600;letter-spacing:-.02em}
.card,.mini{background:var(--card);box-shadow:none;border-radius:28px}
.small,.hS,.tag,.lrow .tx span,.stat span,.mini span,.leg span,.debug{color:var(--mute)}
.stat b,.big{font-weight:500}
.pill{background:var(--card);color:#fff;box-shadow:none}.pill.dark{background:#fff;color:#111}.pill.soft{background:var(--soft);color:#fff}
.btn{background:var(--soft);color:#fff;font-weight:600;font-size:15px;padding:16px 18px}.btn.dark{background:#fff;color:#111}.btn.coral{background:var(--coral);color:#fff}.btn.red{background:var(--red)}
.seg{background:var(--card)}.seg button{color:var(--mute)}.seg button.sel{background:#fff;color:#111;box-shadow:none}
.toggle{background:#555}.toggle.on{background:var(--coral)}
.nav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:#1C1C1C;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.55);padding:10px 8px;z-index:20}
.nav button{color:rgba(255,255,255,.72);font-weight:500}.nav button.sel{color:var(--coral)}
.toast{background:#fff;color:#111}
.check{background:var(--card);border:1px solid rgba(255,255,255,.1)}
.sheet{background:#161616;color:#fff}
.backb{background:var(--card);color:#fff;box-shadow:none}
.pm{background:rgba(210,63,47,.22);color:#FF8173}.pm.add{background:rgba(238,115,70,.22);color:var(--coral)}
.ai{background:rgba(238,115,70,.14)}.risk{background:#2E2416}
.mapbtns button{background:var(--card);color:#fff}
input{background:var(--card)!important;color:#fff!important;border-color:#555!important}
:focus-visible{outline-color:var(--coral)}
.bar{background:var(--soft)}
.tile{border-radius:28px;padding:18px;position:relative;text-align:left;display:block;width:100%;font:inherit}
.t-coral{background:var(--coral);color:var(--on)}.t-yel{background:var(--yel);color:var(--on)}.t-white{background:var(--offw);color:var(--on)}.t-dark{background:var(--card);color:#fff}.t-red{background:var(--red);color:#fff}
.t-coral .small,.t-yel .small,.t-white .small,.t-coral .tag,.t-yel .tag,.t-white .tag{color:#111}
.tbig{font-size:40px;font-weight:500;letter-spacing:-.04em;line-height:1}
.ttl{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.circ{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#111;color:#fff}
.circ.w{background:#fff;color:#111}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:-6px;min-height:24px}
.ins{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{padding:10px 18px;border-radius:99px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap;color:#fff}.chip.sel{background:#fff;color:#111}
.hold .hr .p{transition:stroke-dashoffset .2s linear}.hold.holding .hr .p{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}
.splash{position:absolute;inset:0;z-index:90;background:var(--coral);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;transition:opacity .45s}.splash.out{opacity:0}
.sel-tile{box-shadow:0 0 0 3px #fff inset}
.banner{color:#111}.banner span{opacity:1}
.circ.sm{width:36px;height:36px}.circ.d{background:#333;color:#fff}.circ.r{background:rgba(210,63,47,.22);color:#FF8173}
.mtile{background:var(--card);border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cd{background:rgba(255,255,255,.15);border-radius:24px;padding:16px 18px}
.full-over{position:absolute;inset:0;z-index:29;background:var(--bg);display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 22px);overflow-y:auto;gap:14px}
.pairring{animation:pr 1.6s infinite}@keyframes pr{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.pairring{transform-origin:center;transform-box:fill-box}

</style>
</head>
<body>
<div class="app" id="app">
  <main class="content" id="content" aria-label="SoleMate"></main>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="check"></div>
  <div id="xrUI" style="display:none;position:fixed;inset:0;z-index:60;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 14px 20px;pointer-events:none"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Demo controls" hidden></div>
  <div id="overlay"></div>
</div>
<script>
/* ================= constants ================= */
let STEP_LEN=0.7;          // metres per step (adjustable in Demo)
const ALERT_M=8;           // second, close warning (metres)
const EARLY_M=20;          // first heads-up (metres)
const ALERT_TYPES=['ice','up','down','slope'];   // flat or rocky ground: stay quiet
// ---- Slip threshold from research ----
// Iraqi, Cham, Redfern, Vidic & Beschorner (2018), J. Biomechanics 74:57-63 — 39 unexpected slips:
// sliding speed 0.10 m/s at slip start (20 ms after heel strike) -> 1.87 m/s at peak sliding speed (150 ms).
// Average foot acceleration during the slip = (1.87-0.10)/(0.150-0.020) = 13.6 m/s².
// Allowing ±10% error: slip band 12.3 – 15.0 m/s². We trigger at the LOWER bound (12.3 m/s²);
// anything above the band is an even harder slip and also counts.
const SLIP_AVG=13.6, SLIP_LOW=+(SLIP_AVG*0.9).toFixed(1), SLIP_HIGH=+(SLIP_AVG*1.1).toFixed(1);
const SLIP_WIN=130;        // ms — the slip window measured in the study (20 ms -> 150 ms)
let SLIP_TH=SLIP_LOW;      // m/s² (Demo → sensitivity can lower it for classroom tests)
const C={teal:'#EE7346',red:'#D23F2F',orange:'#DB7F2A',green:'#4ADE80',blue:'#3E8ED0',ink:'#121214'};
const P={run:'<path d="M13 4a2 2 0 1 0 4 0 2 2 0 0 0-4 0"/><path d="M7 21l3-6 3 2v5M10 15l1-6 4 3 3 1M8 9l3-1"/>',map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',report:'<path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/>',buddy:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.8-1.6-4.8-4-5.6"/>',ar:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/>',alert:'<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>',head:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};

  if(t-fallCand>800&&onSide&&gyro<30){if(!tiltStill)tiltStill=t;if(t-tiltStill>3000){fallCand=0;tiltStill=0;fall('sensor');}}else tiltStill=0;

const totalM=()=>S.steps*STEP_LEN+S.offset;
const pos=()=>((totalM()%TRAIL_M)+TRAIL_M)%TRAIL_M;
const lap=()=>Math.floor(totalM()/TRAIL_M);

function routeNow(){for(const h of S.hazards){if(!['up','down','slope'].includes(h.type))continue;const d=pos()-h.pos;if(d>=0&&d<10)return h.type==='down'?'down':'up';}return'flat';}
const terrainNow=()=>S.slopeForced||(S.mount==='sock'?(S.sensUp?'up':routeNow()):S.slope);
function nextHazard(){let best=null;for(const h of S.hazards)if(ALERT_TYPES.includes(h.type)&&(!best||ahead(h)<ahead(best)))best=h;return best;}
function checkHazards(){const L=lap();for(const h of S.hazards){if(!ALERT_TYPES.includes(h.type))continue;const d=h.pos-pos();

 else if(d>0&&d<=ALERT_M&&h.lap!==L){h.lap=L;h.earlyLap=L;alertHazard(h,d,false);}}}
const EARLY={ice:'Ice in about 20 metres.',up:'Uphill in about 20 metres.',down:'Downhill in about 20 metres.',slope:'Steep slope in about 20 metres.'};
const MSG={ice:'Ice ahead. Slow down and take short, flat steps.',up:'Uphill ahead. Short steps.',down:'Downhill ahead. Slow down.',slope:'Steep slope ahead. Take it easy.',uneven:'Rocky ground ahead. Watch your step.'};
const HCOL={ice:'#3E8ED0',up:'#DB7F2A',down:'#5B8FE0',slope:'#DB7F2A',uneven:'#7A5BCF'};
function alertHazard(h,d,early){
 if(!S.sharing){toast('Hazard ahead, but terrain alerts are off. Turn on sharing in Map.');return;}
 S.banner={title:early?`${h.label} coming up`:`${h.label} ahead`,sub:`in ${d.toFixed(0)} m`,msg:(early?EARLY[h.type]:MSG[h.type])||MSG.ice,color:HCOL[h.type]||C.red};

  else if(c.kind==='rest'){if(!moved)fall('still');}

let actx=null;

 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;[0,.45].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=180;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.3);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.32);});}catch(e){}}

const WHY={

 const loc=S.fix?`${S.fix.lat.toFixed(5)}, ${S.fix.lon.toFixed(5)} (±${Math.round(S.fix.acc)} m)`:`${S.dest||'River Valley Trail'}, ${(S.steps*STEP_LEN).toFixed(0)} m along`;
 return`SoleMate: Ryan ${w.msg}. Last moved ${mv?mv+' min ago':'just now'}. Location: ${loc}. Battery ${S.batLevel!=null?Math.round(S.batLevel*100)+'%':'unknown'}. Live map: solemate.app/r/ryan`;}

 if(S.onBreak){if(S.breakUntil&&now>S.breakUntil&&!S.check)openCheck({kind:'breakover'});return;}

/* ================= analysis ================= */
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function analysis(){const n=S.strikes.heel+S.strikes.mid+S.strikes.fore;const now=performance.now();
 const cad=S.strides.filter(t=>now-t<15000).length*2*4;
 const imp=avg(S.impacts),pr=avg(S.pron);
 const iv=[];for(let i=1;i<S.strides.length;i++){const d=S.strides[i]-S.strides[i-1];if(d<3000)iv.push(d);}
 const m=avg(iv),cv=iv.length>2?Math.sqrt(avg(iv.map(x=>(x-m)**2)))/m:0;
 let score=null;if(n>=2){score=100-(n?S.strikes.heel/n:0)*12-Math.max(0,imp-2.2)*10-Math.max(0,Math.abs(pr)-5)*2.2-Math.min(cv,.5)*50-S.slips*4;score=Math.round(Math.max(40,Math.min(98,score)));}
 const strike=!n?'—':S.strikes.heel>=S.strikes.mid&&S.strikes.heel>=S.strikes.fore?'Heel':S.strikes.fore>S.strikes.mid?'Forefoot':'Midfoot';
 const rolling=!S.pron.length?'—':pr>6?'Rolling in':pr<-6?'Rolling out':'Neutral';
 const landing=!S.impacts.length?'—':imp>2.8?'Hard':imp>1.8?'Medium':'Soft';
 let status='Waiting for steps',sc='#68635B';if(score!==null){if(score>=80){status='Form: good';sc=C.green}else if(score>=62){status='Form: watch it';sc=C.orange}else{status='Form: needs work';sc=C.red}}
 // estimated pressure map from motion
 const hs=n?S.strikes.heel/n:.33,fs=n?S.strikes.fore/n:.2;let heel=.25+hs*.5,toe=.18+fs*.5+(S.slope.includes('up')?.15:0),inner=.3+Math.max(-.2,Math.min(.2,pr*.02)),outer=.3-Math.max(-.2,Math.min(.2,pr*.02));
 const tot=heel+toe+inner+outer;const share={heel:heel/tot,toe:toe/tot,inner:inner/tot,outer:outer/tot};
 return{n,cad,imp,pr,cv,score,strike,rolling,landing,status,sc,share};}

/* ================= rendering ================= */
const pct=x=>Math.round(x*100)+'%';
function mix(a,b,t){t=Math.max(0,Math.min(1,t));const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}

 <div class="card" style="margin-top:14px;box-shadow:none;background:var(--bg)"><div class="tag" style="margin-bottom:8px">Live sensor data</div><div class="debug"><span>Forward tilt</span><span id="dP">${live.pitch.toFixed(0)}°</span><span>Side tilt</span><span id="dR">${live.roll.toFixed(0)}°</span><span>Rotation</span><span id="dG">${live.gyro.toFixed(0)}°/s</span><span>Impact</span><span id="dA">${live.g.toFixed(1)} g</span><span>Last stride rise / length</span><span id="dZ">${(live.dz*100).toFixed(0)} cm / ${live.dd.toFixed(2)} m</span><span>Ground grade (3 strides)</span><span id="dS">${(NAV.grade*100).toFixed(0)}%</span><span>Side wobble (4 steps)</span><span id="dU">${live.unev.toFixed(1)}°</span><span>Slide accel (130 ms)</span><span id="dJ">${(live.slideAvg||0).toFixed(1)} m/s²</span><span>Re-acceleration after landing (peak)</span><span id="dK">${live.slideMax.toFixed(2)} m/s</span></div><p class="small" style="margin-top:8px">Each stride is measured planted-to-planted (ZUPT), so the swing arc cancels. Uphill/downhill when the grade over the last 3 strides is above 5% (3 strides must agree; 2 if steeper than 15%). Ice can't be sensed directly: it is announced from hazards other hikers reported and from places where slips were detected. Uneven ground when side wobble &gt; 5°. Slip when, after the foot has landed, it speeds up again by ≥ 0.8 m/s with Earth-horizontal acceleration ≥ ${SLIP_TH} m/s² over 130 ms and little rotation (research band ${SLIP_LOW}–${SLIP_HIGH} m/s², Iraqi et al. 2018).</p></div>`;}

/* ================= start / sensors ================= */
function unlockAudio(){   // iOS only lets a page talk/beep if the first sound starts inside a tap
 try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){}}
let sensorsOn=false;
async function enableSensors(){if(sensorsOn)return;sensorsOn=true;
 // iPhone: ask for Motion & Orientation access FIRST, while we are still inside the tap
 const perm=[];try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)perm.push(DeviceMotionEvent.requestPermission());}catch(e){}
 try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)perm.push(DeviceOrientationEvent.requestPermission());}catch(e){}
 unlockAudio();
 try{navigator.geolocation&&navigator.geolocation.watchPosition(p=>{S.fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};},()=>{},{enableHighAccuracy:true,maximumAge:5000});}catch(e){}
 try{navigator.getBattery&&navigator.getBattery().then(b=>{S.batLevel=b.level;b.addEventListener('levelchange',()=>{S.batLevel=b.level;});});}catch(e){}
 try{const r=await Promise.all(perm);if(r.some(x=>x!=='granted'))toast('Motion access is off. Close this tab, open the app again and tap Allow.');}catch(e){toast('Motion access is off. Close this tab, open the app again and tap Allow.');}
 window.addEventListener('devicemotion',onMotion);
 const ori=e=>{if(e.beta!=null)devBeta=e.beta;if(e.webkitCompassHeading!=null)heading=e.webkitCompassHeading;   // iPhone compass
  else if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute'))heading=(360-e.alpha)%360;};
 window.addEventListener('deviceorientationabsolute',ori);window.addEventListener('deviceorientation',ori);
 try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
async function start(){const p=enableSensors();S.started=true;S.pickDest=false;if(S.pendingJoin){joinGroup(...S.pendingJoin);S.pendingJoin=null;}S.startT=Date.now();S.eta=Date.now()+Math.round((DESTKM[S.dest]||3)/4.5*60+10)*60000;await p;calibrate();}
const setCalN=n=>{const e=document.getElementById('calN');if(e&&n>0)e.firstChild.nodeValue=n;};
function calibrate(){calibBuf={x:0,y:0,z:0,n:0,gx:0,gy:0,gz:0,skip:false};calibPhase='still';speak('Calibrating your insoles. Stand still.',100);let n=3;renderOverlay();
 const iv=setInterval(()=>{n--;setCalN(n);if(n>0)return;clearInterval(iv);
  const ok0=calibBuf.n>5, g0=ok0?norm([calibBuf.x,calibBuf.y,calibBuf.z]):[0,0,1];
  let f0=ok0?[calibBuf.x/calibBuf.n,calibBuf.y/calibBuf.n,calibBuf.z/calibBuf.n]:[0,0,9.81];
  if(ok0&&IS_IOS){const dom=f0.reduce((a,v)=>Math.abs(v)>Math.abs(a)?v:a,0);if(dom<0){ACC_SIGN=-ACC_SIGN;f0=f0.map(v=>-v);}}   // upright/face-up should read +g
  const gs=ok0?norm(f0):[0,0,1];
  const gb=ok0?[calibBuf.gx/calibBuf.n,calibBuf.gy/calibBuf.n,calibBuf.gz/calibBuf.n]:[0,0,0];
  calibBuf={x:0,y:0,z:0,n:0,gx:0,gy:0,gz:0,skip:true};calibPhase='lean';renderOverlay();
  speak('Now lean forward a little and hold.',100);
  let m=3;const iv2=setInterval(()=>{m--;setCalN(m);if(m===2)calibBuf.skip=false;if(m>0)return;clearInterval(iv2);
   const g1=calibBuf.n>5?norm([calibBuf.x,calibBuf.y,calibBuf.z]):null;
   calib=buildCalib(gs,g1);calibBuf=null;calibPhase=null;navInit(f0,gb);toast('Walk about 10 steps on flat ground to finish setup');speak('Now walk about ten steps on flat ground.');S.stancePitch=[];S.stanceRoll=[];
   renderOverlay();render();
   if(!sensorsSeen)toast('Insoles not found. Use Demo to try the app.');
   else{speak(calib.learned?'SoleMate is ready. Start walking.':'I could not feel the lean, so I used default directions. You can recalibrate in Demo.',100);if(!calib.learned)toast('Lean not detected · using default directions (Demo → Recalibrate)');}},1000);},1000);}
async function startCam(){if(camStream)return attachCam();try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});attachCam();}catch(e){}}
function attachCam(){const v=document.getElementById('cam');if(v&&camStream&&v.srcObject!==camStream)v.srcObject=camStream;}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.started){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}});

/* ================= misc ================= */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4500);}

document.addEventListener('pointerup',()=>{drag=null;});document.addEventListener('pointercancel',()=>{drag=null;});

 if(a==='dest-go'){const v=(document.getElementById('destIn')||{}).value||'';const k=Object.keys(DEST).find(x=>x.toLowerCase().includes(v.trim().toLowerCase())&&v.trim());setDest(k||v.trim()||'River Valley Trail');renderOverlay();return;}
 if(a.startsWith('dest-')){setDest(a.slice(5));renderOverlay();return;}
 if(a==='demo'){demoSheet(true);return;}if(a==='demo-close'){demoSheet(false);return;}
 // emergency
 if(a==='sos'){demoSheet(false);fall('sos');return;}
 if(a==='fall'||a==='d-fall'){demoSheet(false);fall('demo');return;}

 if(a==='ck-help'){closeCheck();fall('check');return;}
 if(a==='ck-break'){openCheck({kind:'breakpick'});return;}
 if(a==='ck-slip-break'){const id=S.check&&S.check.hid;S.hazards=S.hazards.filter(h=>h.id!==id);S.slips=Math.max(0,S.slips-1);openCheck({kind:'breakpick'});return;}
 if(a==='ck-moving'){S.lastStepT=Date.now();S.onBreak=false;closeCheck();render();return;}
 if(a==='brk-custom'){openCheck({kind:'breakcustom'});return;}
 if(a==='brk-back'){openCheck({kind:'breakpick'});return;}
 if(a==='brk-go'){const v=Math.round(+((document.getElementById('brkIn')||{}).value));if(!(v>=1&&v<=240)){const e=document.getElementById('brkErr');if(e)e.textContent='Enter a number from 1 to 240.';return;}S.lastCustom=v;startBreak(v);return;}
 if(a.startsWith('brk-')&&a!=='brk-more'){startBreak(+a.slice(4));return;}
 if(a==='brk-more'){S.breakUntil=Date.now()+15*60000;closeCheck();toast('Pause extended 15 min');return;}
 if(a==='late-more'){S.eta=Date.now()+15*60000;S.lateAsked=false;closeCheck();toast('ETA moved 15 min · Emma & Mom can see it');return;}
 if(a==='compose-close'){closeCheck();return;}
 if(a==='compose-send'){const v=((document.getElementById('msgIn')||{}).value||'').trim();const to=S.check&&S.check.to;closeCheck();if(!v)return;
  if(to==='group'){S.msgs.push({id:Date.now(),from:'You',text:v,pos:pos()});toast('Sent · it shows on everyone’s map');}else toast(`Sent to ${to}`);render();return;}
 if(a==='msg-group'){openCheck({kind:'compose',to:'group'});return;}

 if(a.startsWith('person-')){S.mapPerson=a.slice(7)==='close'?null:a.slice(7);render();return;}
 if(a==='xr-start'){startXR();return;}
 if(a==='xr-exit'){if(xrState)xrState.session.end();return;}

 if(a==='d-late'){demoSheet(false);S.eta=Date.now()-1;S.lateAsked=false;return;}
 if(a==='d-batt'){demoSheet(false);S.batSent=false;lowBattery();return;}
 if(a==='break'){openCheck({kind:'breakpick'});return;}
 if(a==='resume'){S.onBreak=false;S.breakUntil=0;S.lastStepT=Date.now();toast('Welcome back');}
 else if(a==='coach')S.coachOn=!S.coachOn;
 else if(a==='mode-earbuds'||a==='mode-map')S.alertMode=a.slice(5);

 else if(a==='voice'){S.voice=S.voice===false;S.alertMode=S.voice?'earbuds':'screen';renderOverlay();return;}
 else if(a==='endwalk'){toast(`Walk saved · ${S.steps.toLocaleString()} steps · ${S.slips} slip${S.slips===1?'':'s'}`);S.onBreak=false;S.pickDest=true;renderOverlay();return;}
 else if(a==='buddy')S.buddy=!S.buddy;
 else if(a.startsWith('b-')){const k=a.slice(2);S.buddies[k]=!S.buddies[k];}
 else if(a==='doctor')toast('Private link created for your doctor · expires in 7 days');
 // report
 else if(a.startsWith('per-')){S.period=a.slice(4);S.repDate=null;}
 else if(a==='rep-today')S.repDate=null;
 // map
 else if(a.startsWith('pin-')&&a!=='pin-close'){S.mapSel=+a.slice(4);if(tab==='buddy'){const h=S.hazards.find(x=>x.id===S.mapSel);if(h){const q=at(h.pos);S.mapPan=[-(q[0]-158)*S.mapZoom,-(q[1]-195)*S.mapZoom];}}}
 else if(a==='pin-close'){S.mapSel=null;}
 else if(a==='saferoute')S.safeRoute=!S.safeRoute;
 else if(a==='zin')S.mapZoom=Math.min(3,+(S.mapZoom*1.4).toFixed(2));
 else if(a==='zout')S.mapZoom=Math.max(.7,+(S.mapZoom/1.4).toFixed(2));
 else if(a==='zme')centerMe();
 else if(a.startsWith('pan-')){const d=a.slice(4),k=40;S.mapPan=[S.mapPan[0]+(d==='l'?k:d==='r'?-k:0),S.mapPan[1]+(d==='u'?k:d==='d'?-k:0)];}
 // group

 else if(a.startsWith('vis-')){const[,k,m]=a.split('-');if(S.trek){

  toast(nv==='hide'?`${k} can’t see you`:nv==='loc'?`${k} sees your location`:nv==='foot'?`${k} sees your footsteps in AR`:`${k} sees your location and footsteps`);}}
 else if(a.startsWith('add-')){const k=a.slice(4);if(S.trek&&!S.trek.members.includes(k)){S.trek.members.push(k);S.trek.vis[k]='loc+foot';if(k==='Emma'&&!S.msgs.length)S.msgs.push({id:Date.now(),from:'Emma',text:'Icy patch by the bridge!',pos:(pos()+PEOPLE.Emma.d*.6)%TRAIL_M});toast(`${k} added · you see each other’s footprints`);}}

 render();});
document.addEventListener('change',e=>{if(e.target.id==='repDate'){S.repDate=e.target.value||null;render();setTimeout(()=>{const i=document.getElementById('repDate');if(i)i.focus();},0);}});

// SOS lives in Safety and needs a 3-second press so it can't be sent by accident
let holdT=null;
